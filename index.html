<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Worthington</title>
    <link rel="icon" href="/photos/profile/tutle-logo-explode-ver.png" type="image/icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            transition: background-image 1s ease-in-out;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), transparent),
                        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.6), transparent),
                        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.5), transparent),
                        radial-gradient(1px 1px at 160px 80px, rgba(255,255,255,0.7), transparent),
                        radial-gradient(1px 1px at 200px 20px, rgba(255,255,255,0.9), transparent),
                        radial-gradient(1px 1px at 50px 90px, rgba(255,255,255,0.4), transparent),
                        radial-gradient(1px 1px at 120px 60px, rgba(255,255,255,0.6), transparent),
                        radial-gradient(1px 1px at 180px 10px, rgba(255,255,255,0.5), transparent),
                        radial-gradient(1px 1px at 10px 80px, rgba(255,255,255,0.7), transparent),
                        radial-gradient(1px 1px at 70px 50px, rgba(255,255,255,0.8), transparent),
                        #000;
            background-repeat: repeat;
            background-size: 200px 100px;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: -1;
        }

        body.hovered-portfolio::after {
            background-image: url('pictures/dfsdf.png');
            opacity: 0.5;
        }

        body.hovered-deskmat::after {
            background-image: url('pictures/bg.png');
            opacity: 0.5;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .box {
            width: 300px;
            height: 400px;
            margin: 20px;
            border: 2px solid #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.6s ease-in-out;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .box h2, .box p {
            position: relative;
            z-index: 2;
            margin: 10px;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .portfolio {
            background-image: url('/photos/profile/me-drawn-at-daydream-by-eugene-the-goat.png');
        }

        .deskmat {
            background-image: url('pictures/image.png');
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box portfolio" onclick="window.location.href='home.html'">
            <h2>Portfolio</h2>
            <p>my personal site with projects, pirated music and more</p>
        </div>
        <div class="box deskmat" onclick="window.open('https://deskmat.xyz', '_blank')">
            <h2>Deskmat</h2>
            <p>what is deskmat, great question</p>
        </div>
    </div>
    <footer>
        Made by <a href="https://github.com/joshxhtml" target="_blank">Joshua Worthington</a>
    </footer>

    <script>
        const portfolioBox = document.querySelector('.portfolio');
        const deskmatBox = document.querySelector('.deskmat');
        const body = document.body;

        portfolioBox.addEventListener('mouseenter', () => {
            body.classList.add('hovered-portfolio');
        });

        portfolioBox.addEventListener('mouseleave', () => {
            body.classList.remove('hovered-portfolio');
        });

        deskmatBox.addEventListener('mouseenter', () => {
            body.classList.add('hovered-deskmat');
        });

        deskmatBox.addEventListener('mouseleave', () => {
            body.classList.remove('hovered-deskmat');
        });
    </script>
</body>
</html>
